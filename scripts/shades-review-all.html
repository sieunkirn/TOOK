<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>호수 전체 검수</title>
<!-- 호수 전체 검수 (scripts/shades-server.js 의 /all). 모든 제품·모든 호수의 판정을 보고 넣기/빼기/색 고치기/되돌리기.
     결정은 src/data/shades-review.json 에 저장되고, '앱에 반영'을 누르면 npm run shades:build 와 같은 일을 한다 -->
<style>
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#f4f4f4;color:#111}
header{position:sticky;top:0;z-index:2;background:#111;color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
header b{font-size:18px}
#stats{opacity:.8;font-size:13px}
#build{margin-left:auto;font:inherit;padding:8px 16px;border-radius:999px;border:0;background:#fff;color:#111;cursor:pointer;font-weight:600}
#build:disabled{opacity:.5}
.bar{position:sticky;top:56px;z-index:1;background:#f4f4f4;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #ddd}
.bar input{font:inherit;padding:7px 12px;border:1px solid #bbb;border-radius:999px;min-width:220px}
.chip{font:13px system-ui;padding:6px 12px;border-radius:999px;border:1px solid #bbb;background:#fff;cursor:pointer}
.chip[aria-pressed="true"]{background:#111;color:#fff;border-color:#111}
main{padding:12px 20px 60px}
.help{background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;line-height:1.7;font-size:14px}
.prod{background:#fff;border-radius:12px;margin-bottom:8px}
.prod>button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;cursor:pointer}
.prod>button .t{font-weight:600;flex:1;min-width:0}
.cnt{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.b{padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-auto{background:#e7f3ea;color:#1d5d2d}.s-manual{background:#e3ecfa;color:#1c4587}.s-excluded{background:#f6e3e3;color:#8a1f1f}
.s-bad{background:#eee;color:#555}.s-pending{background:#fff1cc;color:#7a5600}
.body{padding:0 14px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.it{border:1px solid #e3e3e3;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;gap:10px}
.pic{position:relative;flex:none}
.pic img{display:block;width:120px;height:120px;object-fit:contain;border-radius:8px;background:#eee;cursor:crosshair}
.mark{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000;pointer-events:none;display:none}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.dot{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.hex{width:86px;font:13px ui-monospace,monospace;padding:4px 6px;border:1px solid #bbb;border-radius:6px}
.hex.bad{border-color:#c00}
.chg{font-size:12px;color:#06c}
.nm{font-weight:600}
.alt{font-size:12px;color:#666;word-break:keep-all}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}
.thumbs button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:6px;overflow:hidden;outline:1px solid #ddd}
.thumbs button[aria-pressed="true"]{outline:2px solid #111}
.thumbs img{width:100%;height:100%;object-fit:cover}
.btns{display:flex;gap:6px}
.btns button{flex:1;font:inherit;font-size:14px;padding:7px;border-radius:999px;border:1px solid #111;background:#fff;cursor:pointer}
.btns .ok{background:#111;color:#fff}
.btns .rs{flex:none;border-color:#bbb;color:#555}
.empty{padding:20px;text-align:center;color:#666}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;display:none;max-width:90vw;white-space:pre-wrap}
</style>
</head>
<body>
<header><b>호수 전체 검수</b><span id="stats">불러오는 중…</span><button id="build" type="button">앱에 반영</button></header>
<div class="bar">
  <input id="q" type="search" placeholder="브랜드·제품 이름으로 찾기" aria-label="제품 찾기">
  <span id="filters"></span>
</div>
<main>
  <div class="help">
    제품을 누르면 호수가 펼쳐져요. 색 배지는 지금 상태예요: <span class="b s-auto">자동 통과</span> <span class="b s-manual">사람이 넣음</span> <span class="b s-excluded">사람이 뺌</span> <span class="b s-bad">자동 제외</span> <span class="b s-pending">검수 대기</span><br>
    <b>스포이드</b>: 사진을 누르면 그 자리 색 · <b>색상코드</b>: 직접 고치기 · 작은 사진들: 같은 호수의 다른 옵션 사진으로 바꾸기 ·
    <b>넣기</b>: 지금 사진·색으로 앱에 넣기 · <b>빼기</b>: 앱에서 빼기 · <b>되돌리기</b>: 사람 결정을 지우고 자동 판정으로<br>
    다 고친 뒤 위의 <b>앱에 반영</b>을 눌러야 키오스크 화면에 들어가요.
  </div>
  <div id="list"></div>
</main>
<div id="toast" role="status"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const IMG = 'https://image.oliveyoung.co.kr/cfimages/cf-goods/uploads/images/';
const STATUS = { auto: '자동 통과', manual: '사람이 넣음', excluded: '사람이 뺌', bad: '자동 제외', pending: '검수 대기' };
const IN_APP = ['auto', 'manual'];
let products = [];
let filter = 'all';
let dirty = false;

function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), ms); }
const toHex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
const isHex = (s) => /^#[0-9A-F]{6}$/i.test(s);

async function loadAll() {
  products = (await (await fetch('/api/all')).json()).products;
  renderStats();
  renderFilters();
  renderList();
}
function total(key) { return products.reduce((n, p) => n + p.count[key], 0); }
function renderStats() {
  const inApp = total('auto') + total('manual');
  const withShades = products.filter((p) => p.count.auto + p.count.manual > 0).length;
  $('#stats').textContent = `제품 ${products.length}개 중 ${withShades}개 · 앱에 들어갈 호수 ${inApp}개` + (dirty ? ' · 반영 안 된 변경 있음' : '');
}
function renderFilters() {
  const items = [['all', '전체'], ...Object.entries(STATUS)];
  const box = $('#filters'); box.innerHTML = '';
  for (const [k, label] of items) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', String(filter === k));
    b.textContent = label + (k === 'all' ? '' : ' ' + total(k));
    b.onclick = () => { filter = k; renderFilters(); renderList(); };
    box.appendChild(b);
  }
}
function renderList() {
  const q = $('#q').value.trim().toLowerCase();
  const list = products.filter((p) => (!q || p.label.toLowerCase().includes(q)) && (filter === 'all' || p.count[filter] > 0));
  const box = $('#list'); box.innerHTML = '';
  if (!list.length) { box.innerHTML = '<div class="empty">맞는 제품이 없어요.</div>'; return; }
  for (const p of list) box.appendChild(prodRow(p));
}
function counts(c) {
  const el = document.createElement('span'); el.className = 'cnt';
  for (const k of Object.keys(STATUS)) if (c[k]) { const s = document.createElement('span'); s.className = 'b s-' + k; s.textContent = STATUS[k] + ' ' + c[k]; el.appendChild(s); }
  if (!Object.values(c).some(Boolean)) el.textContent = '호수 없음 (옵션이 하나뿐)';
  return el;
}
function prodRow(p) {
  const sec = document.createElement('section'); sec.className = 'prod';
  const head = document.createElement('button'); head.type = 'button'; head.setAttribute('aria-expanded', 'false');
  const t = document.createElement('span'); t.className = 't'; t.textContent = p.label;
  head.append(t, counts(p.count));
  const body = document.createElement('div'); body.className = 'body'; body.hidden = true;
  head.onclick = async () => {
    const open = head.getAttribute('aria-expanded') !== 'true';
    head.setAttribute('aria-expanded', String(open)); body.hidden = !open;
    if (open) await loadProduct(p, body);
  };
  sec.append(head, body);
  p.head = head;
  return sec;
}
async function loadProduct(p, body) {
  body.innerHTML = '<div class="empty">불러오는 중…</div>';
  const data = await (await fetch('/api/product?goodsNo=' + p.goodsNo)).json();
  const groups = data.groups.filter((g) => filter === 'all' || g.status === filter);
  const grid = document.createElement('div'); grid.className = 'grid';
  for (const g of groups) grid.appendChild(shadeCard(p, g, body));
  body.innerHTML = '';
  body.appendChild(groups.length ? grid : Object.assign(document.createElement('div'), { className: 'empty', textContent: '이 제품에는 보여 줄 호수가 없어요.' }));
}
// 스포이드: 누른 자리 주변 5×5 픽셀 평균 (이미지 서버가 CORS 를 열어 둬서 캔버스로 읽을 수 있다)
function sample(img, ev) {
  const r = img.getBoundingClientRect(), w = img.naturalWidth, h = img.naturalHeight;
  const s = Math.min(r.width / w, r.height / h), ox = (r.width - w * s) / 2, oy = (r.height - h * s) / 2;
  const x = Math.round((ev.clientX - r.left - ox) / s), y = Math.round((ev.clientY - r.top - oy) / s);
  if (x < 0 || y < 0 || x >= w || y >= h) return null;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
  const d = ctx.getImageData(Math.max(0, x - 2), Math.max(0, y - 2), 5, 5).data;
  let R = 0, G = 0, B = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { R += d[i]; G += d[i + 1]; B += d[i + 2]; n++; }
  return { hex: toHex(R / n, G / n, B / n), left: ev.clientX - r.left, top: ev.clientY - r.top };
}
function shadeCard(p, g, body) {
  // 지금 고른 옵션(사진)과 색. 사람이 고친 색이 있으면 그 색
  let opt = g.options.find((o) => o.key === g.shownKey) || g.options[0];
  const decidedHex = g.options.find((o) => o.decision && o.decision.hex)?.decision.hex;
  let cur = (g.status === 'manual' && decidedHex) || g.hex;
  const base = () => opt.hex;
  const d = document.createElement('div'); d.className = 'it';
  d.innerHTML = '<div class="top"><div class="pic"><img alt="옵션 사진 (누르면 그 자리 색)" crossorigin="anonymous"><span class="mark"></span></div>'
    + '<div class="side"><span class="b"></span><span class="dot"></span><input class="hex" maxlength="7" aria-label="색상코드"><span class="chg"></span></div></div>'
    + '<div class="nm"></div><div class="alt"></div><div class="thumbs"></div>'
    + '<div class="btns"><button class="ok" type="button">넣기</button><button class="no" type="button">빼기</button><button class="rs" type="button" title="사람 결정을 지우고 자동 판정으로">되돌리기</button></div>';
  const img = $('img', d), dot = $('.dot', d), hex = $('.hex', d), chg = $('.chg', d), mark = $('.mark', d);
  const badge = $('.side .b', d); badge.className = 'b s-' + g.status; badge.textContent = STATUS[g.status];
  $('.nm', d).textContent = g.label;
  const show = () => {
    img.src = opt.img ? IMG + opt.img + '?RS=300x0' : '';
    $('.alt', d).textContent = opt.alt;
    dot.style.background = cur || '#fff'; hex.value = cur || ''; hex.classList.remove('bad');
    chg.textContent = cur && opt.hex && cur !== opt.hex ? '사진 자동값 ' + opt.hex + ' → 고침' : '';
  };
  // 같은 호수의 다른 옵션 사진 (단품·기획·세트)
  const thumbs = $('.thumbs', d);
  if (g.options.length > 1) for (const o of g.options) {
    const b = document.createElement('button'); b.type = 'button'; b.title = o.alt; b.setAttribute('aria-pressed', String(o.key === opt.key));
    b.innerHTML = '<img alt="">'; if (o.img) b.firstChild.src = IMG + o.img + '?RS=80x0';
    b.onclick = () => { opt = o; cur = o.hex; mark.style.display = 'none'; for (const x of thumbs.children) x.setAttribute('aria-pressed', String(x === b)); show(); };
    thumbs.appendChild(b);
  }
  img.onclick = (ev) => {
    let s; try { s = sample(img, ev); } catch (e) { toast('이 사진은 색을 읽을 수 없어요. 색상코드를 직접 넣어 주세요.'); return; }
    if (!s) return;
    cur = s.hex; mark.style.display = 'block'; mark.style.left = s.left + 'px'; mark.style.top = s.top + 'px'; show();
  };
  hex.oninput = () => {
    let v = hex.value.trim().toUpperCase(); if (v && v[0] !== '#') v = '#' + v;
    if (isHex(v)) { cur = v; dot.style.background = v; hex.classList.remove('bad'); chg.textContent = opt.hex && v !== opt.hex ? '사진 자동값 ' + opt.hex + ' → 고침' : ''; }
    else hex.classList.add('bad');
  };
  const others = () => g.options.map((o) => o.key).filter((k) => k !== opt.key);
  const save = async (value) => {
    const body2 = { key: opt.key, value, clear: others() };
    if (value === 'ok') { if (!isHex(cur || '')) { hex.classList.add('bad'); return; } if (cur !== opt.hex) body2.hex = cur; }
    const r = await fetch('/api/decision', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body2) });
    if (!r.ok) { toast((await r.json()).error || '저장하지 못했어요'); return; }
    dirty = true;
    await refresh(p, body);
    toast(value === 'ok' ? g.label + ' 넣음' : value === 'exclude' ? g.label + ' 뺌' : g.label + ' 자동 판정으로 되돌림');
  };
  $('.ok', d).onclick = () => save('ok');
  $('.no', d).onclick = () => save('exclude');
  const rs = $('.rs', d);
  if (!g.decided) rs.hidden = true;
  rs.onclick = () => save('reset');
  show();
  return d;
}
// 결정 뒤: 그 제품의 개수와 펼친 호수만 다시 그린다
async function refresh(p, body) {
  const all = (await (await fetch('/api/all')).json()).products;
  const fresh = all.find((x) => x.goodsNo === p.goodsNo);
  if (fresh) { p.count = fresh.count; p.head.replaceChild(counts(p.count), p.head.querySelector('.cnt')); }
  products = products.map((x) => all.find((y) => y.goodsNo === x.goodsNo) ? Object.assign(x, { count: all.find((y) => y.goodsNo === x.goodsNo).count }) : x);
  renderStats(); renderFilters();
  await loadProduct(p, body);
}
$('#q').addEventListener('input', renderList);
$('#build').onclick = async () => {
  const b = $('#build'); b.disabled = true; b.textContent = '반영하는 중…';
  try {
    const r = await (await fetch('/api/build', { method: 'POST' })).json();
    dirty = false; renderStats();
    toast('앱에 반영했어요\n' + (r.log || '').split('\n').slice(0, 2).join('\n'), 4000);
  } catch (e) { toast('반영하지 못했어요: ' + e.message, 4000); }
  b.disabled = false; b.textContent = '앱에 반영';
};
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
loadAll();
</script>
</body>
</html>
