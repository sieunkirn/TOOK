<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: 아이폰 아래 홈 표시줄 자리(env(safe-area-inset-bottom))를 쓴다. interactive-widget: 안드로이드 키보드가 열리면 화면 높이를 줄여 입력줄이 가려지지 않게 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title data-i18n="chat.pageTitle">took(툭) - AI 뷰티 챗봇</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/took-mood.css"><!-- TOOK_prototype 무드 (검정·분홍 빛, 2026-11-16) -->
<link rel="stylesheet" href="css/chat-start.css"><!-- 대화 전 시작 화면 (아멜리 HEVA 시작 화면 구성, 2026-11-17) -->
<link rel="manifest" href="manifest.webmanifest">
<script src="js/fullscreen-keep.js"></script><!-- 전체화면 고정: 빠져도 다음 터치에서 다시 -->
</head>
<body class="tui-mood">
<main class="fit chat-user">
  <section class="area chat-shell">
    <div class="chat-head">
      <div>
        <strong data-i18n="chat.title">took 뷰티 챗봇</strong>
      </div>
      <div class="row">
        <button type="button" id="tts" class="icon-btn" aria-pressed="true" aria-label="답변 소리로 읽어주기" title="답변 소리로 읽어주기" data-i18n-aria="chat.tts" data-i18n-title="chat.tts">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path class="tts-wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="tts-mute" d="m22 9-6 6m0-6 6 6"/></svg>
        </button>
        <!-- 립 다시 바르기: 팔레트 거울 화면으로. 대화·섞은 색·바른 립은 그대로 둔다 (초기화 없음) -->
        <button type="button" id="chat-to-palette" onclick="location.href='palette.html'" data-i18n="chat.toPalette">립 다시 바르기</button>
      </div>
    </div>

    <div id="base-chip" class="msg small hidden">
      <span data-i18n="chat.base">기준 제품:</span> <strong id="base-name"></strong>
      <button type="button" id="base-clear" data-i18n="chat.baseClear">해제</button>
    </div>

    <!-- 시작 화면 (대화가 없을 때만, js/chat-start.js): 위로 바뀌며 지나가는 예시 질문 → 입력창(아래 chat-form) → 화면 키보드 -->
    <section id="cs-top" class="cs-top" hidden></section>

    <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>

    <div id="compare-box" class="compare-box hidden" role="region" aria-label="비교함" data-i18n-aria="chat.compare">
      <strong data-i18n="chat.compare">비교함</strong>
      <span id="compare-count" class="muted small"></span>
      <div id="compare-items" class="compare-items"></div>
      <button type="button" id="compare-run" data-i18n="chat.compareRun">비교하기</button>
      <button type="button" id="compare-clear" data-i18n="chat.compareClear">비우기</button>
    </div>

    <!-- 입력: 아래 화면 터치 키보드로 쓰거나 답변 아래 빠른 답장 버튼을 누른다. 마이크(음성 질문)는 2026-11-15 뺐다 (합본 studio.html 에는 남아 있다) -->
    <form id="chat-form" class="chat-input voice-only no-mic" autocomplete="off">
      <label for="chat-input" class="hidden" data-i18n="chat.heard">들은 말</label>
      <input type="text" id="chat-input" readonly tabindex="-1" placeholder="아래 키보드로 입력하세요">
      <!-- 보내기: 글자가 있을 때만 켜진다 (화면 키보드의 '보내기'와 같은 동작) -->
      <button type="submit" id="chat-send" class="cs-send" disabled aria-label="보내기" title="보내기" data-i18n-aria="chat.send" data-i18n-title="chat.send">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="currentColor"><path d="M12.76 22q-.6 0-.87-.43a4.4 4.4 0 0 1-.45-1.07l-1.37-4.54q-.12-.43-.09-.69.04-.27.29-.53l8.77-9.46a.24.24 0 0 0 .08-.17.2.2 0 0 0-.07-.15.24.24 0 0 0-.16-.06q-.09-.01-.17.07L9.3 13.77q-.29.26-.55.29-.27.03-.68-.1l-4.64-1.41a4.2 4.2 0 0 1-1.02-.45Q2 11.84 2 11.24q0-.46.37-.8t.91-.54L18.06 4.24q.3-.11.56-.17.27-.07.48-.07.42 0 .66.24t.24.66q0 .23-.07.48-.06.26-.17.56l-5.67 14.77q-.25.56-.6.92-.35.37-.73.37"/></svg>
      </button>
    </form>
    <p id="nfc-hint" class="nfc-hint" aria-live="polite"></p>
  </section>

  <aside class="area chat-side" id="rec-panel" aria-label="추천 제품" data-i18n-aria="chat.side">
    <div class="panel-head">
      <div class="label" id="panel-label">추천 제품</div>
    </div>

    <div id="list-view">
      <p id="rec-status" class="muted small" aria-live="polite"></p>
      <div id="rec-list" class="mini-list"></div>
    </div>
  </aside>
</main>
<script type="module" src="js/chat.js"></script>
</body>
</html>
